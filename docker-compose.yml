name: estudo-arquitetura

services:
  backend:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-estudo_local}
    ports:
      - "${APP_FORWARD_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: docker/node
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "${FRONTEND_FORWARD_PORT:-4300}:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-estudo}
      POSTGRES_TEST_DB: ${DB_TEST_DATABASE:-estudo_test}
      POSTGRES_USER: ${DB_USERNAME:-estudo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estudo_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    ports:
      - "${DB_FORWARD_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Testes E2E. Rodam sob demanda: docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/e2e
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./e2e:/app/e2e
    environment:
      E2E_BASE_URL: http://frontend:4200
      CI: ${CI:-}
      HOME: /tmp
    command: ["bash", "-c", "npm ci && npx playwright test"]
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
