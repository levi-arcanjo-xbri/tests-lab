<main class="auth">
  <div class="card">
    <span class="brand"><span class="logo">✓</span> Tasks</span>
    <h1>Entrar</h1>
    <p class="muted">Organize seus projetos e tasks.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="footer muted">
      Ainda não tem conta? <a routerLink="/register">Cadastre-se</a>
    </p>
    <p class="footer muted"><small>Demo: demo&#64;example.com / password</small></p>
  </div>
</main>
